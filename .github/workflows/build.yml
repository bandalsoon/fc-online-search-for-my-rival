name: Build check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify official friendly match metadata
        run: |
          curl --fail --silent https://open.api.nexon.com/static/fconline/meta/matchtype.json \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).filter(x=>/친선|1on1/i.test(x.desc))))"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Server health check
        run: |
          pnpm start > /tmp/fc-online-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3001/api/health | grep -q '"ok":true'; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fc-online-server.log
          exit 1
